name: Deploy web prototype to GitHub Pages

on:
  push:
    branches:
      - claude/meross-scheduler-prd-edycrr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test scheduling and timeline
        run: npm test

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Export React Native Web
        env:
          EXPO_BASE_URL: /MRScheduler
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}
          EXPO_PUBLIC_DEPLOYED_AT: ${{ github.event.head_commit.timestamp }}
        run: npm run export:web --workspace=@mrscheduler/mobile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
